name: Android compatibility evidence

on:
  push:
    branches:
      - codex/nonfunctional-testing-2026-11
    paths-ignore:
      - 'web/**'
      - 'server/**'
      - 'tests/**'
      - 'reference/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-compatibility:
    name: Android ${{ matrix.android-version }} · ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            android-version: "10"
            profile: "Nexus 5"
            screen-class: small
          - api-level: 34
            android-version: "14"
            profile: pixel_7_pro
            screen-class: large
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Run emulator compatibility checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disable-linux-hw-accel: true
          script: >-
            bash -euo pipefail .github/scripts/run-android-compatibility.sh
            '${{ matrix.android-version }}' '${{ matrix.api-level }}'
            '${{ matrix.profile }}' '${{ matrix.screen-class }}'

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-evidence
          path: mobile/artifacts/nonfunctional-android/
          if-no-files-found: warn
