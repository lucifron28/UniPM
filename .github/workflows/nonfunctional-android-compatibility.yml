name: Android compatibility evidence

on:
  push:
    branches:
      - codex/nonfunctional-testing-2026-11
    paths:
      - '.github/workflows/nonfunctional-android-compatibility.yml'
      - '.github/scripts/run-android-compatibility.sh'
      - 'mobile/**'
      - 'server/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-compatibility:
    name: Android ${{ matrix.android-version }} · ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            android-version: "10"
            profile: "Nexus 5"
            screen-class: small
          - api-level: 34
            android-version: "14"
            profile: "pixel_7_pro"
            screen-class: large

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Prepare ephemeral SQL Server and synthetic credentials
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="mobile/artifacts/nonfunctional-android/api-${{ matrix.api-level }}"
          mkdir -p "$evidence_dir"

          db_password="Aa1!$(openssl rand -hex 20)"
          dev_password="Aa1!$(openssl rand -hex 20)"
          jwt_key="$(openssl rand -hex 32)"
          connection_string="Server=127.0.0.1,1433;Database=UniPMAndroidSmoke;User Id=sa;Password=$db_password;Encrypt=True;TrustServerCertificate=True;MultipleActiveResultSets=True"

          echo "::add-mask::$db_password"
          echo "::add-mask::$dev_password"
          echo "::add-mask::$jwt_key"
          echo "::add-mask::$connection_string"
          {
            echo "UNIPM_DEV_USER_PASSWORD=$dev_password"
            echo "ConnectionStrings__DefaultConnection=$connection_string"
            echo "Jwt__Issuer=UniPM.AndroidCompatibility"
            echo "Jwt__Audience=UniPM.AndroidCompatibility"
            echo "Jwt__SigningKey=$jwt_key"
            echo "UNIPM_DEV_SKIP_DEPARTMENT_HEAD_ACCOUNT=true"
            echo "ASPNETCORE_ENVIRONMENT=Development"
          } >> "$GITHUB_ENV"

          docker run --detach \
            --name unipm-android-smoke-sql \
            --publish 1433:1433 \
            --env ACCEPT_EULA=Y \
            --env MSSQL_PID=Developer \
            --env "MSSQL_SA_PASSWORD=$db_password" \
            mcr.microsoft.com/mssql/server:2022-latest \
            > "$evidence_dir/sql-container-id.txt"

          sqlcmd_path=""
          for attempt in $(seq 1 60); do
            for candidate in /opt/mssql-tools18/bin/sqlcmd /opt/mssql-tools/bin/sqlcmd; do
              if docker exec unipm-android-smoke-sql sh -c "test -x $candidate" 2>/dev/null; then
                sqlcmd_path="$candidate"
                break
              fi
            done
            if [[ -n "$sqlcmd_path" ]]; then break; fi
            sleep 5
          done
          if [[ -z "$sqlcmd_path" ]]; then
            echo "sqlcmd was not found in the SQL Server container." >&2
            docker logs unipm-android-smoke-sql > "$evidence_dir/sqlserver-container.log" 2>&1 || true
            exit 1
          fi

          ready=false
          for attempt in $(seq 1 60); do
            if docker exec unipm-android-smoke-sql "$sqlcmd_path" \
              -S localhost -U sa -P "$db_password" -C -b -Q "SELECT 1" \
              >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != true ]]; then
            docker logs unipm-android-smoke-sql > "$evidence_dir/sqlserver-container.log" 2>&1 || true
            echo "The ephemeral SQL Server did not become ready within five minutes." >&2
            exit 1
          fi

          docker exec unipm-android-smoke-sql "$sqlcmd_path" \
            -S localhost -U sa -P "$db_password" -C -b \
            -Q "CREATE DATABASE UniPMAndroidSmoke; ALTER DATABASE UniPMAndroidSmoke SET COMPATIBILITY_LEVEL = 150;"
          echo "SQL Server 2022 Developer started with a fresh synthetic test database (compatibility level 150)."

      - name: Build API and seed synthetic development data
        shell: bash
        run: |
          set -euo pipefail
          evidence_dir="mobile/artifacts/nonfunctional-android/api-${{ matrix.api-level }}"
          mkdir -p "$evidence_dir"

          dotnet restore server/server.csproj
          dotnet build server/server.csproj --configuration Release --no-restore
          {
            dotnet server/bin/Release/net10.0/UniPM.Api.dll --migrate-database
            dotnet server/bin/Release/net10.0/UniPM.Api.dll --seed-development-users
            dotnet server/bin/Release/net10.0/UniPM.Api.dll --seed-demo
          } 2>&1 | tee "$evidence_dir/backend-setup.log"

          nohup dotnet server/bin/Release/net10.0/UniPM.Api.dll \
            --urls http://0.0.0.0:5254 \
            > "$RUNNER_TEMP/unipm-android-api.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/unipm-android-api.pid"

          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5254/health/ready >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            cat "$RUNNER_TEMP/unipm-android-api.log"
            echo "The synthetic UniPM API did not become ready within two minutes." >&2
            exit 1
          fi
          echo "The Development API is ready on the local runner; the emulator will reach it through 10.0.2.2:5254."

      - name: Enable KVM where available
        shell: bash
        run: |
          set -euo pipefail
          if [[ -e /dev/kvm ]]; then
            sudo modprobe kvm || true
            sudo groupadd -f kvm
            sudo usermod -aG kvm "$USER" || true
            sudo chmod 0666 /dev/kvm
            ls -l /dev/kvm
            if [[ -r /dev/kvm && -w /dev/kvm ]]; then
              echo "KVM device is available to the runner; the emulator action will select acceleration automatically."
            else
              echo "KVM device exists but is not usable by this runner; emulator acceleration will be auto-detected."
            fi
          else
            echo "This runner has no /dev/kvm device; emulator acceleration will be auto-detected and recorded."
          fi

      - name: Run emulator compatibility and functional smoke checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          disable-linux-hw-accel: auto
          script: >-
            bash -euo pipefail .github/scripts/run-android-compatibility.sh
            '${{ matrix.android-version }}' '${{ matrix.api-level }}'
            '${{ matrix.profile }}' '${{ matrix.screen-class }}'

      - name: Stop synthetic API and collect backend logs
        if: always()
        shell: bash
        run: |
          set +e
          evidence_dir="mobile/artifacts/nonfunctional-android/api-${{ matrix.api-level }}"
          mkdir -p "$evidence_dir"
          if [[ -f "$RUNNER_TEMP/unipm-android-api.log" ]]; then
            cp "$RUNNER_TEMP/unipm-android-api.log" "$evidence_dir/api-server.log"
          fi
          if docker ps -a --format '{{.Names}}' | grep -qx unipm-android-smoke-sql; then
            docker logs unipm-android-smoke-sql > "$evidence_dir/sqlserver-container.log" 2>&1
            docker rm --force unipm-android-smoke-sql >/dev/null 2>&1
          fi
          if [[ -f "$RUNNER_TEMP/unipm-android-api.pid" ]]; then
            kill "$(cat "$RUNNER_TEMP/unipm-android-api.pid")" >/dev/null 2>&1
          fi

      - name: Upload Android test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-evidence
          path: mobile/artifacts/nonfunctional-android/api-${{ matrix.api-level }}/
          if-no-files-found: error
