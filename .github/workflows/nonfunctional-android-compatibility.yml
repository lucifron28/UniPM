name: Android compatibility evidence

on:
  push:
    branches:
      - codex/nonfunctional-testing-2026-11
    paths-ignore:
      - 'web/**'
      - 'server/**'
      - 'tests/**'
      - 'reference/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-compatibility:
    name: Android ${{ matrix.android-version }} · ${{ matrix.profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        include:
          - api-level: 29
            android-version: "10"
            profile: "Nexus 5"
            screen-class: small
          - api-level: 34
            android-version: "14"
            profile: pixel_7_pro
            screen-class: large
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Enable KVM device access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.1"
          cache: true

      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get

      - name: Run emulator compatibility checks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            bash -euo pipefail <<'ANDROID_CHECKS'
            cd mobile
            mkdir -p artifacts/nonfunctional-android
            {
              echo "android_version=${{ matrix.android-version }}"
              echo "api_level=${{ matrix.api-level }}"
              echo "profile=${{ matrix.profile }}"
              echo "screen_class=${{ matrix.screen-class }}"
              adb shell getprop ro.build.version.release
              adb shell getprop ro.build.version.sdk
              adb shell wm size
              adb shell wm density
              flutter build apk --debug --dart-define=UNIPM_API_BASE_URL=http://10.0.2.2:5254/
              adb install -r build/app/outputs/flutter-apk/app-debug.apk
              adb shell monkey -p io.github.lucifron28.unipm 1
              screen_ready=0
              for attempt in $(seq 1 60); do
                adb shell uiautomator dump /sdcard/unipm-window.xml >/dev/null 2>&1 || true
                if adb shell cat /sdcard/unipm-window.xml | grep -q 'Sign in'; then
                  screen_ready=1
                  break
                fi
                sleep 1
              done
              test "$screen_ready" = "1"
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity'
              adb shell screencap -p /sdcard/unipm-startup.png
              adb pull /sdcard/unipm-startup.png artifacts/nonfunctional-android/startup-${{ matrix.api-level }}.png
              flutter test --device-id emulator-5554 --no-pub --reporter expanded
            } 2>&1 | tee artifacts/nonfunctional-android/run-${{ matrix.api-level }}.log
            ANDROID_CHECKS

      - name: Upload Android evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-evidence
          path: mobile/artifacts/nonfunctional-android/
          if-no-files-found: warn
