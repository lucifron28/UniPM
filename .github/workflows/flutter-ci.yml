name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".github/workflows/flutter-ci.yml"
      - "mobile/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/flutter-ci.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Analyze, test, and build Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Check Dart formatting
        run: |
          format_log="${RUNNER_TEMP}/flutter-format.log"
          if dart format --output=none --set-exit-if-changed lib test >"${format_log}" 2>&1; then
            cat "${format_log}"
          else
            status=$?
            cat "${format_log}"
            while IFS= read -r diagnostic; do
              printf '::error title=Dart formatting::%s\n' "${diagnostic}"
              case "${diagnostic}" in
                Changed\ *)
                  formatted_file="${diagnostic#Changed }"
                  formatted_preview="${RUNNER_TEMP}/formatted-preview.dart"
                  format_diff="${RUNNER_TEMP}/formatted-diff.log"
                  if dart format --output=show "${formatted_file}" >"${formatted_preview}"; then
                    diff -u "${formatted_file}" "${formatted_preview}" >"${format_diff}" || true
                    while IFS= read -r diff_line; do
                      diff_line="${diff_line//'%'/'%25'}"
                      printf '::error title=Dart format diff::%s\n' "${diff_line}"
                    done <"${format_diff}"
                  fi
                  ;;
              esac
            done <"${format_log}"
            exit "${status}"
          fi
      - name: Analyze Flutter app
        run: |
          analyze_log="${RUNNER_TEMP}/flutter-analyze.log"
          if flutter analyze >"${analyze_log}" 2>&1; then
            cat "${analyze_log}"
          else
            status=$?
            cat "${analyze_log}"
            while IFS= read -r diagnostic; do
              case "${diagnostic}" in
                *" • "*) printf '::error::%s\n' "${diagnostic}" ;;
              esac
            done <"${analyze_log}"
            exit "${status}"
          fi
      - name: Diagnose acknowledgement widget tests
        run: |
          test_log="${RUNNER_TEMP}/acknowledgement-tests.log"
          if flutter test --reporter expanded test/preventive_maintenance_form_acknowledgement_test.dart >"${test_log}" 2>&1; then
            cat "${test_log}"
          else
            status=$?
            cat "${test_log}"
            grep -E -m 25 '(Expected:|Actual:|Which:|TestFailure|Exception|Error:|Some tests failed|Test failed)' "${test_log}" | while IFS= read -r diagnostic; do
              diagnostic="${diagnostic//'%'/'%25'}"
              printf '::error title=Acknowledgement widget test::%s\n' "${diagnostic}"
            done
            tail -n 100 "${test_log}" | while IFS= read -r diagnostic; do
              diagnostic="${diagnostic//'%'/'%25'}"
              printf '::error title=Acknowledgement test output::%s\n' "${diagnostic}"
            done
            exit "${status}"
          fi
      - name: Run Flutter tests
        run: |
          run_flutter_tests() {
            label="$1"
            shift
            test_log="${RUNNER_TEMP}/flutter-${label}.log"
            if "$@" >"${test_log}" 2>&1; then
              cat "${test_log}"
              return 0
            else
              status=$?
              cat "${test_log}"
              diagnostics="${RUNNER_TEMP}/flutter-${label}-diagnostics.log"
              grep -E -m 25 '(Expected:|Actual:|Which:|TestFailure|Exception|Error:|Some tests failed|Test failed)' "${test_log}" >"${diagnostics}" || true
              if [ -s "${diagnostics}" ]; then
                while IFS= read -r diagnostic; do
                  diagnostic="${diagnostic//'%'/'%25'}"
                  printf '::error title=Flutter test failure (%s)::%s\n' "${label}" "${diagnostic}"
                done <"${diagnostics}"
              fi
              printf '::error title=Flutter test output (%s)::last 40 log lines follow\n' "${label}"
              tail -n 40 "${test_log}" | while IFS= read -r diagnostic; do
                diagnostic="${diagnostic//'%'/'%25'}"
                printf '::error title=Flutter test output (%s)::%s\n' "${label}" "${diagnostic}"
              done
              return "${status}"
            fi
          }

          run_flutter_tests queued-delete timeout --signal=TERM --kill-after=10s 150s flutter test --reporter expanded --plain-name='deleting a queued row preserves ordered create and delete writes' test/offline_inspection_repository_test.dart
          run_flutter_tests conflict-review timeout --signal=TERM --kill-after=10s 150s flutter test --reporter expanded --plain-name='conflict details and actions remain visible while schedules load' test/offline_inspection_repository_test.dart
          run_flutter_tests conflict-discard timeout --signal=TERM --kill-after=10s 150s flutter test --reporter expanded --plain-name='conflict discard confirmation calls the repository' test/offline_inspection_repository_test.dart
          run_flutter_tests full-suite timeout --signal=TERM --kill-after=10s 20m flutter test --reporter expanded
      - run: flutter build apk --debug
