name: Flutter CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - ".github/workflows/flutter-ci.yml"
      - "mobile/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/flutter-ci.yml"
      - "mobile/**"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Analyze, test, and build Flutter app
    runs-on: ubuntu-latest
    timeout-minutes: 25

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze Flutter app
        run: |
          analyze_log="${RUNNER_TEMP}/flutter-analyze.log"
          if flutter analyze >"${analyze_log}" 2>&1; then
            cat "${analyze_log}"
          else
            status=$?
            cat "${analyze_log}"
            while IFS= read -r diagnostic; do
              case "${diagnostic}" in
                *" • "*) printf '::error::%s\n' "${diagnostic}" ;;
              esac
            done <"${analyze_log}"
            exit "${status}"
          fi
      - name: Run Flutter tests
        run: |
          test_log="${RUNNER_TEMP}/flutter-test.log"
          if flutter test --reporter expanded >"${test_log}" 2>&1; then
            cat "${test_log}"
          else
            status=$?
            cat "${test_log}"
            diagnostics="${RUNNER_TEMP}/flutter-test-diagnostics.log"
            grep -E -m 30 '(\+[0-9]+([[:space:]]+~[0-9]+)?[[:space:]]+-[0-9]+:|Expected:|Actual:|Which:|TestFailure|Exception|Error:|Some tests failed|Test failed)' "${test_log}" >"${diagnostics}" || true
            if [ -s "${diagnostics}" ]; then
              while IFS= read -r diagnostic; do
                printf '::error title=Flutter test failure::%s\n' "${diagnostic}"
              done <"${diagnostics}"
            else
              printf '::error title=Flutter test failure::flutter test exited with status %s; final output follows\n' "${status}"
              tail -n 30 "${test_log}" | while IFS= read -r diagnostic; do
                printf '::error title=Flutter test output::%s\n' "${diagnostic}"
              done
            fi
            exit "${status}"
          fi
      - run: flutter build apk --debug
